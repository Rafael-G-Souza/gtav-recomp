name: Build Android Exynos Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config python3

      - name: Apply warmup-limit.patch and limit threads
        run: |
          if [ -f warmup-limit.patch ]; then
            echo "Aplicando warmup-limit.patch..."
            git apply --ignore-whitespace --verbose warmup-limit.patch || patch -p1 --ignore-whitespace < warmup-limit.patch
          else
            echo "AVISO: warmup-limit.patch nao encontrado na raiz!"
          fi
          # Reduz threads do PipelineCompiler para 1 no Android para evitar Scudo OOM:
          find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/kCompilerThreads = 3/kCompilerThreads = 1/g' {} + || true

      - name: Build libgtav_fast.so
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          echo "Usando NDK em: $ANDROID_NDK_HOME"
          chmod +x tools/android/*.sh || true
          bash -x tools/android/make_shell.sh

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: libgtav_fast_patched
          path: |
            **/libgtav_fast.so
            **/*.apk
