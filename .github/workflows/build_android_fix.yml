- name: Build Android SDK and Game DLL
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          
          chmod +x tools/android/*.sh
          
          # Neutraliza a linha que procura o env.sh inexistente no runner
          sed -i 's|source ~/android-tools/env.sh|# source ~/android-tools/env.sh|g' tools/android/build_sdk.sh || true
          sed -i 's|source /home/runner/android-tools/env.sh|# source /home/runner/android-tools/env.sh|g' tools/android/build_sdk.sh || true

          # 1. Compila o SDK do Android necessário para o empacotamento
          if [ -f tools/android/build_sdk.sh ]; then
            ./tools/android/build_sdk.sh
          fi
          
          # 2. Compila a DLL do jogo para o Android com GTAV_GAME_DLL=ON
          cmake -B build/android-dll -G Ninja \
            -DGTAV_GAME_DLL=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/android-dll --parallel 4
