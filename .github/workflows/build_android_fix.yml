name: Build Android Definitive Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config python3 clang lld llvm libsdl2-dev

      - name: Patch and Fix Scripts
        run: |
          # Aplica o patch das threads
          if [ -f warmup-limit.patch ]; then
            git apply --ignore-whitespace --reject warmup-limit.patch || true
          fi
          
          # Limita as threads no código
          find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/kCompilerThreads = 3/kCompilerThreads = 1/g' {} + || true

          # REMOVE a dependência do ficheiro fantasma do autor nos scripts
          sed -i 's|source ~/android-tools/env.sh|# source ~/android-tools/env.sh|g' tools/android/build_sdk.sh || true
          sed -i 's|source ~/android-tools/env.sh|# source ~/android-tools/env.sh|g' tools/android/make_shell.sh || true

      - name: Build Android SDK and Game DLL
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          
          chmod +x tools/android/*.sh
          
          # 1. Compilar SDK
          if [ -f tools/android/build_sdk.sh ]; then
            ./tools/android/build_sdk.sh
          fi
          
          # 2. Compilar a DLL do jogo 
          cmake -B build/android-dll -G Ninja \
            -DGTAV_GAME_DLL=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/android-dll --parallel 4

      - name: Build APK via make_shell.sh
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          
          # 3. Gerar a biblioteca final e APK
          ./tools/android/make_shell.sh build-android

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: libgtav_fast_patched
          path: |
            build-android/**/*.so
            build-android/**/*.apk
