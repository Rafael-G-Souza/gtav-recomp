name: Build Android Exynos Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config python3 clang lld llvm

      - name: Apply patch and fix make_shell.sh
        run: |
          if [ -f warmup-limit.patch ]; then
            echo "Aplicando warmup-limit.patch..."
            git apply --ignore-whitespace --verbose warmup-limit.patch || true
          fi
          
          # Limita as threads do PipelineCompiler para 1 no Android para evitar OOM:
          find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/kCompilerThreads = 3/kCompilerThreads = 1/g' {} + || true
          
          # Remove a chamada ao env.sh local que quebra o runner do GitHub
          sed -i 's|source ~/android-tools/env.sh|# source ~/android-tools/env.sh|g' tools/android/make_shell.sh

      - name: Build libgtav_fast.so via make_shell.sh
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          echo "Usando NDK em: $ANDROID_NDK_HOME"
          
          chmod +x tools/android/*.sh
          # Passa o diretório de saída como o argumento exigido ($1)
          ./tools/android/make_shell.sh build-android

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: libgtav_fast_patched
          path: |
            **/libgtav_fast.so
            **/*.apk
