name: Build Android Exynos Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config python3 clang lld llvm libsdl2-dev

      - name: Apply patch and limit threads
        run: |
          if [ -f warmup-limit.patch ]; then
            echo "Aplicando warmup-limit.patch..."
            git apply --ignore-whitespace --verbose warmup-limit.patch || true
          fi
          # Limita as threads do PipelineCompiler para 1 no Android para evitar OOM:
          find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/kCompilerThreads = 3/kCompilerThreads = 1/g' {} + || true

      - name: Build Android SDK and Game DLL
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          
          chmod +x tools/android/*.sh
          
          # 1. Compila o SDK do Android necessário para o empacotamento
          if [ -f tools/android/build_sdk.sh ]; then
            ./tools/android/build_sdk.sh
          fi
          
          # 2. Compila a DLL do jogo para o Android com GTAV_GAME_DLL=ON
          cmake -B build/android-dll -G Ninja \
            -DGTAV_GAME_DLL=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/android-dll --parallel 4

      - name: Build final APK / make_shell
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          
          # Agora o diretório build/android-dll contém o libgtav_fast.so exigido
          ./tools/android/make_shell.sh build-android

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: libgtav_fast_patched
          path: |
            **/libgtav_fast.so
            **/*.apk
